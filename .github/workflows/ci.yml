name: CI

# Автоматическая проверка на PR (pull и push reauest)
on:
  push:
    branches:
      - MLOps-branch
  pull_request:
    branches:
      - MLOps-branch

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонируем репозиторий
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Устанавливаем Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 3. Устанавливаем зависимости
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Линтинг
      - name: Lint code
        run: |
          pip install black
          black --check .
      
      # pip install flake8
      #  flake8 . --max-line-length=110   (для проверки форматирования другой аналог black)

      # 5. Запуск тестов
      - name: Run tests
        run: |
          python -m unittest discover -s tests

